        .app-subtitle { font-size: 0.7em; opacity: 0.9; margin-top: 2px; }
        .live-clock { font-size: 0.7em; opacity: 0.95; margin-top: 4px; font-variant-numeric: tabular-nums; }
        .lang-select { background: white; color: #1967D2; border: none; border-radius: 6px; padding: 5px 8px; font-size: 0.78em; font-weight: 700; cursor: pointer; }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 16px; }
        #map { flex: 1; width: 100%; height: 100%; position: relative; }

        .toggle-btn { background: #7c3aed; color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; margin-bottom: 12px; width: 100%; font-size: 0.88em; transition: all .2s; }

        .toggle-btn.secondary:hover { background: #1967D2; }
        .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .btn-row .toggle-btn { margin-bottom: 0; }

        .search-box { position: relative; margin-bottom: 10px; }
        .search-input { width: 100%; padding: 10px 12px 10px 34px; border-radius: 8px; border: 1px solid #dadce0; font-size: 0.9em; }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 0.95em; opacity: 0.6; }
        .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        .chip { padding: 5px 10px; border-radius: 16px; border: 1.5px solid #dadce0; background: white; font-size: 0.73em; cursor: pointer; font-weight: 500; color: #444; }
        .chip.active { background: #4285F4; border-color: #4285F4; color: white; }
        .chip.region-chip.active { background: #0f9d58; border-color: #0f9d58; }
        .filter-group-label { font-size: 0.68em; font-weight: 700; text-transform: uppercase; color: #999; margin: 4px 0 4px; letter-spacing: .4px; }
        .select-input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #dadce0; font-size: 0.85em; margin-bottom: 12px; background: white; }

        .weather-widget { background: linear-gradient(135deg, #fef9e7 0%, #e3f2fd 100%); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; border: 1px solid #ffe9a8; }
        .weather-row { display: flex; justify-content: space-between; align-items: center; }
        .weather-temp { font-size: 1.4em; font-weight: 700; color: #202124; }
        .weather-detail { font-size: 0.75em; color: #5f6368; line-height: 1.5; }
        .golden-hour-tag { display: inline-block; margin-top: 6px; background: #ff8f00; color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.68em; font-weight: 700; }

        .live-conditions { background: #f0f7ff; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #cfe3ff; }
        .live-conditions-title { font-size: 0.7em; font-weight: 700; color: #1967D2; text-transform: uppercase; margin-bottom: 6px; letter-spacing: .3px; }
        .live-conditions-row { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.78em; color: #333; }
        .live-conditions-item { display: flex; align-items: center; gap: 4px; }
        .live-conditions-note { font-size: 0.65em; color: #8a8a8a; margin-top: 6px; font-style: italic; }

        .loc-list-item { display: flex; justify-content: space-between; align-items: center; background: white; border: 1px solid #eee; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; transition: all .15s; }
        .loc-list-item:hover { border-color: #4285F4; background: #f8faff; }
        .loc-list-name { font-weight: 600; font-size: 0.9em; color: #202124; }
        .loc-list-meta { font-size: 0.7em; color: #80868b; margin-top: 2px; }
        .loc-list-star { font-size: 1.1em; cursor: pointer; }

        .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
        .info-badge { background: #f1f3f4; color: #444; padding: 4px 9px; border-radius: 6px; font-size: 0.72em; font-weight: 500; display: flex; align-items: center; gap: 4px; }
        .crowd-low { background: #dff5e1; color: #14622a; }
        .crowd-medium { background: #fff4d6; color: #8a6100; }
        .crowd-high { background: #ffe0cc; color: #9a3d00; }
        .crowd-very-high { background: #fde0e0; color: #a30000; }
        .region-badge { background: #e6f4ea; color: #0f9d58; }

        .location-name { font-size: 1.28em; font-weight: 700; color: #202124; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .fav-star-btn { background: none; border: none; font-size: 1.3em; cursor: pointer; }
        .hint-box { background: #fff8e1; border-left: 3px solid #fbbf24; padding: 9px 11px; border-radius: 6px; font-size: 0.8em; color: #7a5c00; margin-bottom: 12px; line-height: 1.4; }

        .section-title { font-weight: 700; color: #202124; margin: 14px 0 8px; font-size: 0.86em; display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: .3px; }

        .filter-section { background: #f9f9f9; border-radius: 6px; padding: 12px; margin-bottom: 12px; border-left: 3px solid #fbbf24; }
        .filter-label { font-weight: 600; color: #5f6368; font-size: 0.8em; text-transform: uppercase; margin-bottom: 8px; }
        .platform-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
        .platform-tab { padding: 6px 12px; border-radius: 20px; border: 2px solid #dadce0; background: white; cursor: pointer; font-size: 0.78em; font-weight: 500; }
        .platform-tab.active { border-color: #4285f4; background: #4285f4; color: white; }
        .platform-count { font-size: 0.7em; margin-left: 2px; }

        .public-posts-section, .community-section, .itinerary-section { background: white; border-radius: 8px; padding: 14px; margin-bottom: 12px; border: 1px solid #dadce0; }

        .photo-post-card { background: #f9f9f9; border-radius: 8px; padding: 10px; margin-bottom: 9px; border-left: 4px solid #4285f4; display: flex; gap: 10px; }
        .post-thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #eee; }
        .post-info { flex: 1; min-width: 0; }
        .post-platform { font-weight: 600; color: #1967d2; font-size: 0.75em; }
        .post-title { font-weight: 500; color: #202124; font-size: 0.85em; margin: 2px 0 4px; word-break: break-word; }
        .post-meta { font-size: 0.7em; color: #80868b; display: flex; gap: 10px; margin-bottom: 5px; }
        .post-hashtags { font-size: 0.7em; color: #1967d2; margin-bottom: 5px; }

        .post-button.pexels { background: #05A081; }
        .post-button.unsplash { background: #000; }
        .post-button.500px { background: #0099E5; }
        .post-button.istockphoto { background: #007DB8; }

        .balloon-subtitle { font-size: 0.7em; opacity: 0.9; }
        .balloon-fav { background: none; border: none; font-size: 1.2em; cursor: pointer; color: white; }
        .balloon-photo-display { position: relative; text-align: center; background: #eee; }
        .balloon-photo-img { width: 100%; height: 140px; object-fit: cover; display: block; }
        .balloon-photo-caption { font-weight: 600; color: #202124; font-size: 0.8em; padding: 8px 10px 0; }
        .balloon-photo-source { display: inline-block; background: #f1f3f4; padding: 2px 8px; border-radius: 10px; font-size: 0.65em; font-weight: 600; color: #5f6368; margin: 4px 10px 0; }
        .balloon-photo-likes { font-size: 0.68em; color: #80868b; padding: 4px 10px 0; }
        .balloon-live-row { font-size: 0.65em; color: #444; padding: 4px 10px 0; display: flex; gap: 8px; flex-wrap: wrap; }
        .balloon-dots { display: flex; justify-content: center; gap: 4px; padding: 8px 0 6px; }
        .balloon-dot { width: 6px; height: 6px; border-radius: 50%; background: #dadce0; }
        .balloon-dot.active { background: #4285f4; width: 15px; border-radius: 3px; }
        .balloon-body { padding: 6px 12px 12px; }
        .balloon-hashtags { font-size: 0.65em; color: #1967d2; margin-bottom: 8px; }
        .balloon-buttons { display: flex; gap: 6px; margin-bottom: 6px; }
        .balloon-btn { flex: 1; text-align: center; padding: 7px 5px; border-radius: 6px; text-decoration: none; font-size: 0.66em; font-weight: 700; color: white; cursor: pointer; border: none; }
        .balloon-btn.view-link { background: #1967d2; }
        .balloon-btn.shuffle { background: #7c3aed; }
        .balloon-btn.itin { background: #ff8f00; }
        .balloon-btn.itin.added { background: #10b981; }
        .balloon-details-link { display: block; text-align: center; font-size: 0.7em; color: #7c3aed; font-weight: 600; cursor: pointer; padding-top: 4px; }

        .map-marker-pulse { border-radius: 50%; animation: pulse-marker 2s infinite; }
        @keyframes pulse-marker { 0% { box-shadow: 0 0 0 0 rgba(66,133,244,.6); } 70% { box-shadow: 0 0 0 10px rgba(66,133,244,0); } 100% { box-shadow: 0 0 0 0 rgba(66,133,244,0); } }
    </style>

            case "unsplash": return `https://unsplash.com/s/photos/${loc.slug}`;
            case "500px": return `https://500px.com/search?q=${q}`;
            case "istockphoto": return `https://www.istockphoto.com/search/2/image?phrase=${q}`;
            default: return "#";
        }
    }

    // Deterministic pseudo-random likes count so results are stable across reloads
    function seededLikes(seedStr, i) {
        let hash = 0;
        for (let c = 0; c < seedStr.length; c++) hash = (hash * 31 + seedStr.charCodeAt(c)) >>> 0;
        return 700 + ((hash + i * 137) % 700);
    }

    function generatePostsForLocation(loc) {
        const meta = generatorMeta[loc.name] || { times: ["day"], emojis: ["📸"] };
        return platformCycle.map((platform, i) => {
            const time = meta.times[i % meta.times.length];
            const emoji = meta.emojis[i % meta.emojis.length];
            return {
                id: `${loc.slug}_${i + 1}`,
                location: loc.name,
                time,
                hashtags: `#${loc.slug.replace(/-/g, "")}photo #singaporephotography`,
                platform,
                link: buildPlatformLink(platform, loc),
                title: `${loc.name} — ${platformDisplayName[platform]} Photography`,
                likes: seededLikes(loc.slug, i),
                emoji
            };
        });
    }

    const curatedLocationNames = new Set(curatedPhotos.map(p => p.location));
    const generatedPhotos = locations
        .filter(loc => !curatedLocationNames.has(loc.name))
        .flatMap(loc => generatePostsForLocation(loc));

    const photoAlgorithm = {
        photosDatabase: [...curatedPhotos, ...generatedPhotos],

        analyzePhotos: function() {
            const analysis = {};
            this.photosDatabase.forEach(photo => {
                if (!analysis[photo.location]) {
                    analysis[photo.location] = { location: photo.location, totalPhotos:0, totalLikes:0, averageLikes:0, byTime:{}, byPlatform:{}, bestTime:"unknown", bestTimeScore:0, popularityScore:0, publicPosts:[] };
                }
                analysis[photo.location].totalPhotos += 1;
                analysis[photo.location].totalLikes += photo.likes;
                analysis[photo.location].publicPosts.push(photo);
                if (!analysis[photo.location].byPlatform[photo.platform]) analysis[photo.location].byPlatform[photo.platform] = [];
                analysis[photo.location].byPlatform[photo.platform].push(photo);
                if (!analysis[photo.location].byTime[photo.time]) analysis[photo.location].byTime[photo.time] = { count:0, totalLikes:0, averageLikes:0, posts:[] };
                analysis[photo.location].byTime[photo.time].count += 1;
                analysis[photo.location].byTime[photo.time].totalLikes += photo.likes;
                analysis[photo.location].byTime[photo.time].posts.push(photo);
            });
            Object.keys(analysis).forEach(location => {
                const ld = analysis[location];
                ld.averageLikes = Math.round(ld.totalLikes / ld.totalPhotos);
                ld.publicPosts.sort((a,b) => b.likes - a.likes);
                Object.keys(ld.byTime).forEach(timeOfDay => {
                    const td = ld.byTime[timeOfDay];
                    td.averageLikes = Math.round(td.totalLikes / td.count);
                    td.posts.sort((a,b) => b.likes - a.likes);
                    if (td.averageLikes > ld.bestTimeScore) { ld.bestTimeScore = td.averageLikes; ld.bestTime = timeOfDay; }
                });
                ld.popularityScore = Math.min(100, Math.round(ld.averageLikes / 15));
            });
            return analysis;
        },

        getRecommendations: function() {
            const analysis = this.analyzePhotos();
            const recs = [];
            Object.keys(analysis).forEach(location => {
                const d = analysis[location];
                recs.push({ location, bestTime: d.bestTime, score: d.popularityScore, totalPhotos: d.totalPhotos });
            });
            recs.sort((a,b) => b.score - a.score);
            return recs;
        },

        getPostsByPlatform: function(location, platform) {
            const a = this.analyzePhotos();
            if (!a[location] || !a[location].byPlatform[platform]) return [];
            return a[location].byPlatform[platform];
        },

        getPublicPhotosForLocation: function(location) {
            const a = this.analyzePhotos();
            if (!a[location]) return [];
            return a[location].publicPosts;
        },

        getRandomPhoto: function(location, excludeId) {
            const photos = this.getPublicPhotosForLocation(location);
            let pool = photos;
            if (excludeId && photos.length > 1) pool = photos.filter(p => p.id !== excludeId);
            return pool[Math.floor(Math.random() * pool.length)];
        },

        getPlatformInfo: function(platform) {
            const info = {
                instagram: { name: "Instagram", icon: "📷" }, pexels: { name: "Pexels", icon: "🆓" },
                unsplash: { name: "Unsplash", icon: "⭐" }, "500px": { name: "500px", icon: "📱" },
                istockphoto: { name: "iStock", icon: "💰" }
            };
            return info[platform] || null;
        }
    };

    /* thumbnail image — real (though generic) photo per location, seeded so it's consistent */
    function thumbUrl(slug, w, h) { return `https://picsum.photos/seed/${slug}/${w||400}/${h||300}`; }
    function locationBySlug(slug) { return locations.find(l => l.slug === slug); }
    function slugFor(name) { const l = locations.find(x => x.name === name); return l ? l.slug : name.toLowerCase().replace(/\s+/g,'-'); }

    /* ============ FAVORITES (localStorage) ============ */
    function getFavorites() { try { return JSON.parse(localStorage.getItem('sgphoto_favorites') || '[]'); } catch(e) { return []; } }
    function isFavorite(name) { return getFavorites().includes(name); }
    function toggleFavorite(name) {
        let favs = getFavorites();
        if (favs.includes(name)) favs = favs.filter(f => f !== name); else favs.push(name);
        localStorage.setItem('sgphoto_favorites', JSON.stringify(favs));
        return favs.includes(name);
    }

    /* ============ ITINERARY (localStorage) ============ */
    function getItinerary() { try { return JSON.parse(localStorage.getItem('sgphoto_itinerary') || '[]'); } catch(e) { return []; } }
    function inItinerary(name) { return getItinerary().includes(name); }
    function toggleItinerary(name) {
        let it = getItinerary();
        if (it.includes(name)) it = it.filter(x => x !== name); else it.push(name);
        localStorage.setItem('sgphoto_itinerary', JSON.stringify(it));
        return it.includes(name);
    }
    function clearItinerary() { localStorage.setItem('sgphoto_itinerary', '[]'); }
    function haversine(lat1, lng1, lat2, lng2) {
        const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLng = (lng2-lng1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function optimizeItineraryOrder(names) {
        const pts = names.map(n => locations.find(l=>l.name===n)).filter(Boolean);
        if (pts.length <= 1) return pts;
        const remaining = pts.slice(1); const ordered = [pts[0]];
        let current = pts[0];
        while (remaining.length) {
            let bestIdx = 0, bestDist = Infinity;
            remaining.forEach((p, i) => { const d = haversine(current.lat, current.lng, p.lat, p.lng); if (d < bestDist) { bestDist = d; bestIdx = i; } });
            current = remaining.splice(bestIdx, 1)[0];
            ordered.push(current);
        }
        return ordered;
    }

    /* ============ COMMUNITY PHOTOS (localStorage) ============ */
    function getCommunityPhotos(location) { try { return JSON.parse(localStorage.getItem('sgphoto_community_' + location) || '[]'); } catch(e) { return []; } }
    function addCommunityPhoto(location, name, caption, imageUrl) {
        const list = getCommunityPhotos(location);
        list.unshift({ name: name || 'Anonymous', caption: caption || '', imageUrl: imageUrl || '', date: new Date().toLocaleDateString() });
        localStorage.setItem('sgphoto_community_' + location, JSON.stringify(list));
    }

    /* ============================================================
       LIVE TIME (Singapore) — genuinely real-time via Intl formatting
       ============================================================ */
    function getSingaporeParts() {
        const fmt = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Asia/Singapore', hour12: false, year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short'
        });
        const parts = {};
        fmt.formatToParts(new Date()).forEach(p => { parts[p.type] = p.value; });
        const hour = parseInt(parts.hour, 10);
        const isWeekend = parts.weekday === 'Sat' || parts.weekday === 'Sun';
        return { ...parts, hourNum: hour, isWeekend };
    }
    function formatSingaporeClock() {
        const p = getSingaporeParts();
        return `${p.weekday} ${p.day}/${p.month}/${p.year} · ${p.hour}:${p.minute}:${p.second} SGT`;
    }
    function startLiveClock() {
        const el = document.getElementById('liveClock');
        function tick() { if (el) el.textContent = formatSingaporeClock(); }
        tick();
        setInterval(tick, 1000);
    }

    /* ============================================================
       CROWD ESTIMATOR — time-of-day pattern based (NOT live sensor data,
       clearly disclosed in UI). No free public API provides genuine
       real-time crowd counts for these locations.
       ============================================================ */
    const categoryCrowdProfile = {
        "Landmarks": { peak: [11,12,13,17,18,19,20], weekendBoost: true, base: 1 },
        "Gardens & Nature": { peak: [7,8,9,17,18], weekendBoost: true, base: 0 },
        "Street & Heritage": { peak: [11,12,18,19,20], weekendBoost: true, base: 1 },
        "Night & Skyline": { peak: [19,20,21,22], weekendBoost: true, base: 0 },
        "Beach & Outdoor": { peak: [7,8,17,18], weekendBoost: true, base: 0 },
        "Modern & Architecture": { peak: [10,11,12,13,14], weekendBoost: true, base: 1 }
    };
    function estimateCrowdLevel(loc) {
        const { hourNum, isWeekend } = getSingaporeParts();
        const profile = categoryCrowdProfile[loc.category] || { peak: [], weekendBoost: false, base: 0 };
        let score = profile.base;
        if (profile.peak.includes(hourNum)) score += 2;
        if (isWeekend && profile.weekendBoost) score += 1;
        if (score >= 4) return 'very-high';
        if (score >= 3) return 'high';
        if (score >= 1) return 'medium';
        return 'low';
    }
    function crowdLabel(level) {
        const map = { low: t('crowdLow'), medium: t('crowdMedium'), high: t('crowdHigh'), 'very-high': t('crowdVeryHigh') };
        return map[level] || map.low;
    }
    function crowdClass(level) { return `crowd-${level}`; }

    /* ============================================================
       WEATHER — real per-location current conditions via Open-Meteo
       (free, no API key). Batched into a single multi-coordinate call.
       ============================================================ */
    let weatherByLocation = {};
    const weatherCodeMap = {
        0: "☀️ Clear", 1: "🌤️ Mostly clear", 2: "⛅ Partly cloudy", 3: "☁️ Overcast",
        45: "🌫️ Fog", 48: "🌫️ Fog", 51: "🌦️ Light drizzle", 53: "🌦️ Drizzle", 55: "🌦️ Heavy drizzle",
        61: "🌧️ Light rain", 63: "🌧️ Rain", 65: "🌧️ Heavy rain", 80: "🌦️ Showers", 81: "🌦️ Showers", 82: "🌧️ Violent showers",
        95: "⛈️ Thunderstorm", 96: "⛈️ Thunderstorm", 99: "⛈️ Thunderstorm"
    };
    function weatherCodeText(code) { return weatherCodeMap[code] || "🌡️ N/A"; }

    async function fetchAllLocationWeather() {
        try {
            const lats = locations.map(l => l.lat).join(',');
            const lngs = locations.map(l => l.lng).join(',');
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lngs}&current=temperature_2m,weather_code&timezone=Asia%2FSingapore`);
            const data = await res.json();
            const arr = Array.isArray(data) ? data : [data];
            arr.forEach((d, i) => { if (locations[i]) weatherByLocation[locations[i].name] = d.current; });
        } catch (e) { /* leave weatherByLocation empty; UI falls back gracefully */ }
    }
    </script>

    <!-- ============ MAP + BALLOON POPUPS ============ -->
    <script>
        let map;
        let markerRefs = {};
        const currentBalloonPhoto = {};

        function categoryColor(cat) {
            const colors = { "Landmarks":"#4285F4", "Gardens & Nature":"#0f9d58", "Street & Heritage":"#f4b400", "Night & Skyline":"#ab47bc", "Beach & Outdoor":"#00acc1", "Modern & Architecture":"#e53935" };
            return colors[cat] || "#4285F4";
        }

        async function initMap() {
            map = L.map('map').setView([1.3521, 103.8198], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 19 }).addTo(map);

            locations.forEach((loc) => { addOrUpdateMarker(loc); });

            startLiveClock();
            fetchAllLocationWeather();

            const params = new URLSearchParams(window.location.search);
            const locParam = params.get('loc');
            if (locParam) {
                const loc = locationBySlug(locParam);
                if (loc) {
                    map.setView([loc.lat, loc.lng], 15);
                    setTimeout(() => { markerRefs[loc.name].openPopup(); showLocationPosts(loc.name); }, 400);
                    return;
                }
            }
            renderHome();
        }

        function addOrUpdateMarker(loc) {
            const fav = isFavorite(loc.name);
            const color = fav ? '#ff8f00' : categoryColor(loc.category);
            const markerHtml = `<div class="map-marker-pulse" style="width: 16px; height: 16px; background-color: ${color}; border-radius: 50%; border: 3px solid white;"></div>`;
            if (markerRefs[loc.name]) { map.removeLayer(markerRefs[loc.name]); }
            const marker = L.marker([loc.lat, loc.lng], {
                icon: L.divIcon({ html: markerHtml, className: 'custom-marker', iconSize: [16,16], iconAnchor: [8,8] })
            }).addTo(map);
            marker.bindPopup(() => buildBalloonPopupHTML(loc.name), { maxWidth: 300, minWidth: 280, closeButton: true, autoClose: true });
            marker.on('click', () => showLocationPosts(loc.name));
            markerRefs[loc.name] = marker;
        }
        function refreshMarker(name) { const loc = locations.find(l => l.name === name); if (loc) addOrUpdateMarker(loc); }

        function buildBalloonPopupHTML(locationName) {
            const photo = photoAlgorithm.getRandomPhoto(locationName);
            currentBalloonPhoto[locationName] = photo.id;
            const container = document.createElement('div');
            container.className = 'balloon-popup';
            container.innerHTML = balloonInnerHTML(locationName, photo);
            wireBalloonEvents(container, locationName);
            return container;
        }

        function balloonLiveRowHTML(locationName) {
            const loc = locations.find(l => l.name === locationName);
            if (!loc) return '';
            const w = weatherByLocation[locationName];
            const tempTxt = w && w.temperature_2m !== undefined ? `${Math.round(w.temperature_2m)}°C ${weatherCodeText(w.weather_code)}` : t('weatherUnavailable');
            const crowd = estimateCrowdLevel(loc);
            return `<div class="balloon-live-row"><span>🌡️ ${tempTxt}</span><span>👥 ${crowdLabel(crowd)}</span></div>`;
        }

        function balloonInnerHTML(locationName, photo) {
            const platformInfo = photoAlgorithm.getPlatformInfo(photo.platform);
            const allPhotos = photoAlgorithm.getPublicPhotosForLocation(locationName);
            const photoIndex = allPhotos.findIndex(p => p.id === photo.id);
            const slug = slugFor(locationName);
            let dotsHtml = allPhotos.map((p,i) => `<div class="balloon-dot ${i===photoIndex?'active':''}"></div>`).join('');
            const hashtagsHtml = photo.hashtags.split(' ').slice(0,3).join(' ');
            const fav = isFavorite(locationName);
            const inItin = inItinerary(locationName);
            return `
                <div class="balloon-header">
                    <div><div class="balloon-location-name">🎈 ${locationName}</div><div class="balloon-subtitle">Random photo pick</div></div>
                    <button class="balloon-fav" data-action="fav" data-location="${locationName}" title="Favorite">${fav ? '⭐' : '☆'}</button>
                </div>
                <div class="balloon-photo-display">
                    <img class="balloon-photo-img" src="${thumbUrl(slug, 280, 140)}" alt="${photo.title}" loading="lazy" onerror="this.style.display='none'"/>
                    <div class="balloon-photo-caption">${photo.emoji} ${photo.title}</div>
                    <span class="balloon-photo-source">${platformInfo.icon} ${platformInfo.name}</span>
                    <div class="balloon-photo-likes">❤️ ${photo.likes} likes · ⏰ ${photo.time}</div>
                    ${balloonLiveRowHTML(locationName)}
                </div>
                <div class="balloon-dots">${dotsHtml}</div>
                <div class="balloon-body">
                    <div class="balloon-hashtags">${hashtagsHtml}</div>
                    <div class="balloon-buttons">
                        <button class="balloon-btn shuffle" data-action="shuffle" data-location="${locationName}">${t('shuffle')}</button>
                        <a href="${photo.link}" target="_blank" class="balloon-btn view-link">${platformInfo.icon} ${t('viewOn')} ↗</a>
                    </div>
                    <button class="balloon-btn itin ${inItin?'added':''}" data-action="itin" data-location="${locationName}" style="width:100%;">${inItin ? t('addedToItinerary') : t('addToItinerary')}</button>
                    <div class="balloon-details-link" data-action="details" data-location="${locationName}">See all photos & details →</div>
                </div>
            `;
        }

        function wireBalloonEvents(container, locationName) {
            const shuffleBtn = container.querySelector('[data-action="shuffle"]');
            if (shuffleBtn) shuffleBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); refreshBalloon(container, locationName); });
            const favBtn = container.querySelector('[data-action="fav"]');
            if (favBtn) favBtn.addEventListener('click', (e) => {
                e.preventDefault(); e.stopPropagation();
                const nowFav = toggleFavorite(locationName);
                favBtn.textContent = nowFav ? '⭐' : '☆';
                refreshMarker(locationName);
            });
            const itinBtn = container.querySelector('[data-action="itin"]');
            if (itinBtn) itinBtn.addEventListener('click', (e) => {
                e.preventDefault(); e.stopPropagation();
                const nowIn = toggleItinerary(locationName);
                itinBtn.textContent = nowIn ? t('addedToItinerary') : t('addToItinerary');
                itinBtn.classList.toggle('added', nowIn);
            });
            const detailsLink = container.querySelector('[data-action="details"]');
            if (detailsLink) detailsLink.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); showLocationPosts(locationName); });
        }

        function refreshBalloon(container, locationName) {
            const excludeId = currentBalloonPhoto[locationName];
            const photo = photoAlgorithm.getRandomPhoto(locationName, excludeId);
            currentBalloonPhoto[locationName] = photo.id;
            container.innerHTML = balloonInnerHTML(locationName, photo);
            wireBalloonEvents(container, locationName);
        }
    </script>

    <!-- ============ SIDEBAR: HOME (search/filter/weather/itinerary) ============ -->
    <script>
        let activeCategory = 'all';
        let activeRegion = 'all';
        let activeTimeFilter = 'all';
        let searchQuery = '';

        function filteredLocations() {
            return locations.filter(loc => {
                const matchesSearch = loc.name.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesCategory = activeCategory === 'all' || loc.category === activeCategory;
                const matchesRegion = activeRegion === 'all' || loc.region === activeRegion;
                let matchesTime = true;
                if (activeTimeFilter !== 'all') {
                    const analysis = photoAlgorithm.analyzePhotos();
                    matchesTime = analysis[loc.name] && analysis[loc.name].bestTime === activeTimeFilter;
                }
                return matchesSearch && matchesCategory && matchesRegion && matchesTime;
            });
        }

        function renderHome() {
            const sidebarContent = document.getElementById('sidebarContent');
            const favs = getFavorites();
            const itin = getItinerary();
            let html = `
                <div class="btn-row">
                    <button class="toggle-btn" onclick="toggleAlgorithmPanel()">${t('showRecommendations')}</button>
                </div>
                <div class="btn-row">
                    <button class="toggle-btn secondary" onclick="renderItineraryPanel()">${t('myItinerary')} (${itin.length})</button>
                    <button class="toggle-btn secondary" onclick="renderFavoritesPanel()">${t('favorites')} (${favs.length})</button>
                </div>
                <div id="weatherWidget" class="weather-widget">
                    <div class="weather-row"><div class="weather-temp">--°C</div><div class="weather-detail">${t('weatherNow')}<br/>Loading...</div></div>
                </div>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="searchInput" placeholder="${t('searchPlaceholder')}" value="${searchQuery}" oninput="onSearchInput(this.value)" />
                </div>
                <div class="filter-group-label">${t('allRegions')}</div>
                <div class="filter-chips" id="regionChips">
                    <div class="chip region-chip ${activeRegion==='all'?'active':''}" onclick="setRegion('all')">${t('allRegions')}</div>
                    ${regions.map(r => `<div class="chip region-chip ${activeRegion===r?'active':''}" onclick="setRegion('${r}')">${r}</div>`).join('')}
                </div>
                <div class="filter-group-label">${t('allCategories')}</div>
                <div class="filter-chips" id="categoryChips">
                    <div class="chip ${activeCategory==='all'?'active':''}" onclick="setCategory('all')">${t('allCategories')}</div>
                    ${categories.map(c => `<div class="chip ${activeCategory===c?'active':''}" onclick="setCategory('${c}')">${c}</div>`).join('')}
                </div>
                <select class="select-input" onchange="setTimeFilter(this.value)">
                    <option value="all" ${activeTimeFilter==='all'?'selected':''}>${t('filterByTime')}: ${t('anyTime')}</option>
                    <option value="morning" ${activeTimeFilter==='morning'?'selected':''}>Morning</option>
                    <option value="day" ${activeTimeFilter==='day'?'selected':''}>Day</option>
                    <option value="evening" ${activeTimeFilter==='evening'?'selected':''}>Evening</option>
                    <option value="sunset" ${activeTimeFilter==='sunset'?'selected':''}>Sunset</option>
                    <option value="night" ${activeTimeFilter==='night'?'selected':''}>Night</option>
                </select>
                <div id="locationListContainer"></div>
            `;
            sidebarContent.innerHTML = html;
            renderLocationList();
            fetchWeather();
        }

        function renderLocationList() {
            const container = document.getElementById('locationListContainer');
            if (!container) return;
            const list = filteredLocations();
            if (list.length === 0) { container.innerHTML = `<div class="no-results">No locations match your filters.</div>`; return; }
            let html = '';
            list.forEach(loc => {
                const fav = isFavorite(loc.name);
                const crowd = estimateCrowdLevel(loc);
                html += `
                    <div class="loc-list-item" onclick="showLocationPosts('${loc.name}')">
                        <div>
                            <div class="loc-list-name">${loc.name}</div>
                            <div class="loc-list-meta">${loc.region} · ${loc.category} · <span class="${crowdClass(crowd)}" style="padding:1px 5px; border-radius:4px;">${crowdLabel(crowd)}</span></div>
                        </div>
                        <span class="loc-list-star" onclick="event.stopPropagation(); quickToggleFav('${loc.name}')">${fav ? '⭐' : '☆'}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function quickToggleFav(name) { toggleFavorite(name); refreshMarker(name); renderLocationList(); }
        function onSearchInput(val) { searchQuery = val; renderLocationList(); }
        function setCategory(cat) { activeCategory = cat; renderHome(); }
        function setRegion(region) { activeRegion = region; renderHome(); }
        function setTimeFilter(val) { activeTimeFilter = val; renderLocationList(); }

        /* ============ Singapore-wide WEATHER + GOLDEN HOUR (home widget) ============ */
        async function fetchWeather() {
            const el = document.getElementById('weatherWidget');
            if (!el) return;
            try {
                const [weatherRes, sunRes] = await Promise.all([
                    fetch('https://api.open-meteo.com/v1/forecast?latitude=1.3521&longitude=103.8198&current=temperature_2m,weather_code&timezone=Asia%2FSingapore'),
                    fetch('https://api.sunrise-sunset.org/json?lat=1.3521&lng=103.8198&formatted=0')
                ]);
                const weatherData = await weatherRes.json();
                const sunData = await sunRes.json();
                const temp = weatherData?.current?.temperature_2m;
                const code = weatherData?.current?.weather_code;
                const sunsetUTC = sunData?.results?.sunset;
                let sunsetLocal = '--';
                let goldenHourNow = false;
                if (sunsetUTC) {
                    const sunsetDate = new Date(sunsetUTC);
                    sunsetLocal = sunsetDate.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Singapore' });
                    const now = new Date();
                    const diffMins = Math.abs((sunsetDate - now) / 60000);
                    goldenHourNow = diffMins <= 60;
                }
                el.innerHTML = `
                    <div class="weather-row">
                        <div class="weather-temp">${temp !== undefined ? Math.round(temp) + '°C' : '--°C'}</div>
                        <div class="weather-detail">${t('weatherNow')} ${code !== undefined ? weatherCodeText(code) : ''}<br/>🌇 Sunset today: ${sunsetLocal}</div>
                    </div>
                    ${goldenHourNow ? `<div class="golden-hour-tag">${t('goldenHourSoon')}</div>` : ''}
                `;
            } catch (e) {
                el.innerHTML = `<div class="weather-row"><div class="weather-detail">${t('weatherNow')}<br/>${t('weatherUnavailable')}</div></div>`;
            }
        }
    </script>

    <!-- ============ ITINERARY / FAVORITES PANELS ============ -->
    <script>
        function renderItineraryPanel() {
            const sidebarContent = document.getElementById('sidebarContent');
            const names = getItinerary();
            let html = `<button class="toggle-btn" onclick="renderHome()">${t('backToMap')}</button>
                <div class="itinerary-section">
                    <div class="section-title">🧭 ${t('myItinerary')}</div>`;
            if (names.length === 0) {
                html += `<div class="community-empty">${t('itineraryEmpty')}</div>`;
            } else {
                const ordered = optimizeItineraryOrder(names);
                let totalKm = 0;
                for (let i = 0; i < ordered.length - 1; i++) totalKm += haversine(ordered[i].lat, ordered[i].lng, ordered[i+1].lat, ordered[i+1].lng);
                html += `<div style="font-size:0.78em; color:#5f6368; margin-bottom:10px;">Optimized order · approx ${totalKm.toFixed(1)} km total between stops</div>`;
                ordered.forEach((loc, i) => {
                    const crowd = estimateCrowdLevel(loc);
                    html += `
                        <div class="itinerary-item">
                            <div class="itinerary-order">${i+1}</div>
                            <div style="flex:1;">
                                <div style="font-weight:600; font-size:0.85em; cursor:pointer;" onclick="showLocationPosts('${loc.name}')">${loc.name}</div>
                                <div style="font-size:0.72em; color:#80868b;">${loc.region} · ${loc.category} · <span class="${crowdClass(crowd)}" style="padding:1px 5px; border-radius:4px;">${crowdLabel(crowd)}</span></div>
                            </div>
                            <button class="itinerary-remove" onclick="toggleItinerary('${loc.name}'); renderItineraryPanel();">✕</button>
                        </div>
                    `;
                });
                html += `<div class="btn-row" style="margin-top:10px;">
                    <button class="toggle-btn secondary" onclick="flyItineraryRoute()">${t('optimizeRoute')}</button>
                    <button class="toggle-btn" style="background:#a30000;" onclick="clearItinerary(); renderItineraryPanel();">${t('clearItinerary')}</button>
                </div>`;
            }
            html += `</div>`;
            sidebarContent.innerHTML = html;
        }

        let itineraryLine = null;
        function flyItineraryRoute() {
            const names = getItinerary();
            const ordered = optimizeItineraryOrder(names);
            if (itineraryLine) { map.removeLayer(itineraryLine); itineraryLine = null; }
            if (ordered.length < 2) return;
            const latlngs = ordered.map(l => [l.lat, l.lng]);
            itineraryLine = L.polyline(latlngs, { color: '#ff8f00', weight: 4, dashArray: '6,8' }).addTo(map);
            map.fitBounds(itineraryLine.getBounds(), { padding: [40,40] });
        }

        function renderFavoritesPanel() {
            const sidebarContent = document.getElementById('sidebarContent');
            const favs = getFavorites();
            let html = `<button class="toggle-btn" onclick="renderHome()">${t('backToMap')}</button>
                <div class="itinerary-section">
                    <div class="section-title">⭐ ${t('favorites')}</div>`;
            if (favs.length === 0) {
                html += `<div class="community-empty">No favorites yet — tap ⭐ on any pin or list item.</div>`;
            } else {
                favs.forEach(name => {
                    const loc = locations.find(l => l.name === name);
                    if (!loc) return;
                    html += `
                        <div class="loc-list-item" onclick="showLocationPosts('${loc.name}')">
                            <div><div class="loc-list-name">${loc.name}</div><div class="loc-list-meta">${loc.region} · ${loc.category}</div></div>
                            <span class="loc-list-star" onclick="event.stopPropagation(); quickToggleFav('${loc.name}'); renderFavoritesPanel();">⭐</span>
                        </div>
                    `;
                });
            }
            html += `</div>`;
            sidebarContent.innerHTML = html;
        }

        function toggleAlgorithmPanel() {
            const recs = photoAlgorithm.getRecommendations();
            const sidebarContent = document.getElementById('sidebarContent');
            let html = `<button class="toggle-btn" onclick="renderHome()">${t('backToMap')}</button>
                <div style="background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%); border-radius: 8px; padding: 14px; margin-bottom: 12px; border-left: 4px solid #7c3aed;">
                    <div style="font-weight:700; color:#7c3aed; margin-bottom:6px; font-size:0.9em; text-transform:uppercase;">🤖 AI Recommendations</div>
                    <p style="font-size:0.85em; color:#5f6368;">Ranked across all 37 locations by public photo post engagement</p>
                </div>
                <div class="recommendation-grid">`;
            recs.forEach((rec, i) => {
                html += `
                    <div class="recommendation-item" onclick="showLocationPosts('${rec.location}')">
                        <div class="rec-location">${i+1}. ${rec.location}</div>
                        <div class="rec-info"><span style="font-size:0.8em; color:#5f6368;">⏰ ${rec.bestTime} | 📸 ${rec.totalPhotos}</span><span class="rec-score">${rec.score}/100</span></div>
                    </div>
                `;
            });
            html += `</div>`;
            sidebarContent.innerHTML = html;
        }
    </script>

    <!-- ============ LOCATION DETAIL VIEW ============ -->
    <script>
        function liveConditionsHTML(loc) {
            const w = weatherByLocation[loc.name];
            const tempTxt = w && w.temperature_2m !== undefined ? `${Math.round(w.temperature_2m)}°C ${weatherCodeText(w.weather_code)}` : t('weatherUnavailable');
            const crowd = estimateCrowdLevel(loc);
            const p = getSingaporeParts();
            return `
                <div class="live-conditions">
                    <div class="live-conditions-title">📡 ${t('liveConditions')}</div>
                    <div class="live-conditions-row">
                        <div class="live-conditions-item">🕐 ${p.hour}:${p.minute} SGT</div>
                        <div class="live-conditions-item">📅 ${p.weekday} ${p.day}/${p.month}</div>
                        <div class="live-conditions-item">🌡️ ${tempTxt}</div>
                        <div class="live-conditions-item">👥 <span class="${crowdClass(crowd)}" style="padding:2px 6px; border-radius:5px;">${crowdLabel(crowd)}</span></div>
                    </div>
                    <div class="live-conditions-note">${t('crowdEstNote')}</div>
                </div>
            `;
        }

        function showLocationPosts(locationName) {
            const loc = locations.find(l => l.name === locationName);
            const posts = photoAlgorithm.getPublicPhotosForLocation(locationName);
            const sidebarContent = document.getElementById('sidebarContent');
            const fav = isFavorite(locationName);
            const inItin = inItinerary(locationName);

            let html = `
                <button class="toggle-btn" onclick="renderHome()">${t('backToMap')}</button>
                <div class="location-name">
                    <span>${locationName}</span>
                    <button class="fav-star-btn" onclick="quickToggleFav('${locationName}'); showLocationPosts('${locationName}');">${fav ? '⭐' : '☆'}</button>
                </div>
                <div class="btn-row">
                    <button class="toggle-btn ${inItin ? 'itinerary-add-btn added' : 'itinerary-add-btn'}" onclick="toggleItinerary('${locationName}'); showLocationPosts('${locationName}');">${inItin ? t('addedToItinerary') : t('addToItinerary')}</button>
                    <button class="toggle-btn secondary" onclick="copyShareLink('${locationName}')">${t('shareLink')}</button>
                </div>
            `;

            if (loc) {
                html += liveConditionsHTML(loc);
                html += `
                    <div class="section-title">ℹ️ ${t('tripInfo')}</div>
                    <div class="badge-row">
                        <span class="info-badge region-badge">📍 ${loc.region}</span>
                        <span class="info-badge">${loc.category}</span>
                        <span class="info-badge">${loc.accessibility}</span>
                        <span class="info-badge">${loc.ticket}</span>
                        <span class="info-badge">${loc.tripod}</span>
                    </div>
                `;
            }

            const platforms = [...new Set(posts.map(p => p.platform))];
            html += `<div class="filter-section"><div class="filter-label">📱 Filter by Platform</div><div class="platform-tabs">`;
            platforms.forEach(platform => {
                const pi = photoAlgorithm.getPlatformInfo(platform);
                const count = posts.filter(p => p.platform === platform).length;
                html += `<button class="platform-tab" onclick="filterByPlatform('${locationName}', '${platform}')">${pi.icon} <span class="platform-count">${count}</span></button>`;
            });
            html += `</div></div>`;

            html += `<div class="public-posts-section"><div class="section-title">📸 ${t('publicPosts')} (${posts.length})</div>`;
            posts.forEach(post => {
                const pi = photoAlgorithm.getPlatformInfo(post.platform);
                html += `
                    <div class="photo-post-card">
                        <img class="post-thumb" src="${thumbUrl(slugFor(locationName) + '-' + post.id, 100, 100)}" alt="" loading="lazy" onerror="this.style.display='none'"/>
                        <div class="post-info">
                            <div class="post-platform">${pi.icon} ${post.platform.toUpperCase()}</div>
                            <div class="post-title">${post.title}</div>
                            <div class="post-meta"><span>⏰ ${post.time}</span><span>❤️ ${post.likes}</span></div>
                            <div class="post-hashtags">${post.hashtags.split(' ').slice(0,3).join(' ')}</div>
                            <a href="${post.link}" target="_blank" class="post-button ${post.platform}">${t('viewOn')} ↗</a>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;

            html += renderCommunitySection(locationName);

            sidebarContent.innerHTML = html;
            wireCommunityForm(locationName);

            if (markerRefs[locationName]) { map.panTo(markerRefs[locationName].getLatLng()); }
        }

        function filterByPlatform(locationName, platform) {
            const posts = photoAlgorithm.getPostsByPlatform(locationName, platform);
            const sidebarContent = document.getElementById('sidebarContent');
            const pi = photoAlgorithm.getPlatformInfo(platform);
            let html = `
                <button class="toggle-btn" onclick="showLocationPosts('${locationName}')">${t('backToAll')}</button>
                <div class="location-name"><span>${locationName}</span></div>
                <div style="background:#f9f9f9; padding:12px; border-radius:6px; margin-bottom:12px; border-left:3px solid #4285f4;">
                    <div style="font-weight:600; color:#202124;">${pi.icon} ${pi.name}</div>
                    <div style="font-size:0.85em; color:#5f6368;">${posts.length} photos</div>
                </div>
                <div class="public-posts-section">
            `;
            if (posts.length === 0) { html += `<div class="no-results">No photos on this platform</div>`; }
            else {
                posts.forEach(post => {
                    html += `
                        <div class="photo-post-card">
                            <img class="post-thumb" src="${thumbUrl(slugFor(locationName) + '-' + post.id, 100, 100)}" alt="" loading="lazy" onerror="this.style.display='none'"/>
                            <div class="post-info">
                                <div class="post-platform">${pi.icon} ${post.platform.toUpperCase()}</div>
                                <div class="post-title">${post.title}</div>
                                <div class="post-meta"><span>⏰ ${post.time}</span><span>❤️ ${post.likes}</span></div>
                                <div class="post-hashtags">${post.hashtags.split(' ').slice(0,3).join(' ')}</div>
                                <a href="${post.link}" target="_blank" class="post-button ${post.platform}">${t('viewOn')} ↗</a>
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div>`;
            sidebarContent.innerHTML = html;
        }

        /* ============ COMMUNITY PHOTOS ============ */
        function renderCommunitySection(locationName) {
            const photos = getCommunityPhotos(locationName);
            let html = `<div class="community-section"><div class="section-title">📷 ${t('communityPhotos')}</div>`;
            if (photos.length === 0) {
                html += `<div class="community-empty">${t('noCommunityPhotos')}</div>`;
            } else {
                photos.forEach(p => {
                    html += `
                        <div class="community-photo-item">
                            ${p.imageUrl ? `<img src="${p.imageUrl}" alt="" style="width:100%; max-height:160px; object-fit:cover; border-radius:6px; margin-bottom:6px;" onerror="this.style.display='none'"/>` : ''}
                            <div style="font-weight:600; font-size:0.85em;">${p.name} <span style="font-weight:400; color:#999; font-size:0.85em;">· ${p.date}</span></div>
                            ${p.caption ? `<div style="font-size:0.8em; color:#444; margin-top:2px;">${p.caption}</div>` : ''}
                        </div>
                    `;
                });
            }
            html += `
                <div class="section-title" style="margin-top:14px;">➕ ${t('shareYourPhoto')}</div>
                <div class="community-form">
                    <input type="text" id="communityName" placeholder="${t('yourName')}" maxlength="40" />
                    <textarea id="communityCaption" rows="2" placeholder="${t('caption')}" maxlength="200"></textarea>
                    <input type="url" id="communityImageUrl" placeholder="${t('imageUrlOptional')}" />
                    <button class="toggle-btn secondary" id="communitySubmitBtn">${t('submit')}</button>
                </div>
            </div>`;
            return html;
        }

        function wireCommunityForm(locationName) {
            const btn = document.getElementById('communitySubmitBtn');
            if (!btn) return;
            btn.addEventListener('click', () => {
                const name = document.getElementById('communityName').value.trim();
                const caption = document.getElementById('communityCaption').value.trim();
                const imageUrl = document.getElementById('communityImageUrl').value.trim();
                if (!caption && !imageUrl) return;
                addCommunityPhoto(locationName, name, caption, imageUrl);
                showLocationPosts(locationName);
            });
        }

        /* ============ SHARE LINK ============ */
        function copyShareLink(locationName) {
            const slug = slugFor(locationName);
            const url = `${window.location.origin}${window.location.pathname}?loc=${slug}`;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => alert(t('linkCopied'))).catch(() => prompt('Copy this link:', url));
            } else {
                prompt('Copy this link:', url);
            }
        }
    </script>

    <!-- ============ LANGUAGE DROPDOWN + PWA + INIT ============ -->
    <script>
        function applyLanguageStaticText() {
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
            const sel = document.getElementById('langSelect');
            if (sel) sel.value = currentLang;
        }

        document.getElementById('langSelect').addEventListener('change', (e) => {
            currentLang = e.target.value;
            localStorage.setItem('sgphoto_lang', currentLang);
            applyLanguageStaticText();
            renderHome();
        });

        /* PWA: register service worker if supported */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => { /* offline-safe: fails silently if sw.js unavailable */ });
            });
        }

        applyLanguageStaticText();
        document.addEventListener('DOMContentLoaded', initMap);

        /* Refresh crowd levels + re-render visible panel roughly once a minute so "live" data stays current */
        setInterval(() => {
            const sidebarContent = document.getElementById('sidebarContent');
            if (sidebarContent && sidebarContent.querySelector('.live-conditions')) {
                const nameEl = sidebarContent.querySelector('.location-name span');
                if (nameEl) showLocationPosts(nameEl.textContent);
            }
        }, 60000);
    </script>
</body>
</html>
